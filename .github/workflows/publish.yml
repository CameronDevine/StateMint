name: Publish to PyPI

# Publishes the Python package after Python and Pyodide checks pass for a pushed
# tag. Uses PyPI
# trusted publishing (no API token): a PyPI owner of StateMint must first add
# this repository and workflow as a trusted publisher, with environment
# "pypi" (https://docs.pypi.org/trusted-publishers/adding-a-publisher/).

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    uses: ./.github/workflows/python.yml

  pyodide:
    uses: ./.github/workflows/pyodide.yml

  publish:
    needs: [python, pyodide]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
